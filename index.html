<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#101010" />
    <title>Дивись відео</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        background: #101010;
      }

      main {
        display: grid;
        width: 100%;
        height: 100%;
        place-items: center;
      }

      video {
        width: min(100vw, 177.78vh);
        height: min(100vh, 56.25vw);
        border: 0;
        object-fit: contain;
      }
    </style>
  </head>
  <body>
    <main>
      <video autoplay muted playsinline controls aria-label="Відео">
        <source src="meme.mp4" type="video/mp4" />
      </video>
    </main>
  </body>
</html>
