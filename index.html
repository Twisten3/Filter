<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#101010" />
    <title>Дивись відео</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        background: #101010;
      }

      main {
        display: grid;
        width: 100%;
        height: 100%;
        place-items: center;
      }

      iframe {
        width: min(100vw, 177.78vh);
        height: min(100vh, 56.25vw);
        border: 0;
      }
    </style>
  </head>
  <body>
    <main>
      <iframe
        src="https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1&mute=1&controls=1&playsinline=1&rel=0"
        title="Відео на YouTube"
        allow="autoplay; encrypted-media; picture-in-picture; web-share"
        referrerpolicy="strict-origin-when-cross-origin"
        allowfullscreen
      ></iframe>
    </main>
  </body>
</html>
