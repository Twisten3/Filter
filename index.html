<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#10120f" />
    <title>Далі?</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "Avenir Next", Avenir, sans-serif;
        background: #10120f;
        color: #f5f5ef;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-width: 320px;
        min-height: 100%;
        margin: 0;
      }

      body {
        background-color: #10120f;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
        background-size: 42px 42px;
      }

      main {
        min-height: 100svh;
      }

      [hidden] {
        display: none !important;
      }

      .intro {
        display: grid;
        min-height: 100svh;
        place-content: center;
        justify-items: center;
        gap: 34px;
        padding: 28px;
        text-align: center;
        animation: arrive 700ms cubic-bezier(0.2, 0.75, 0.2, 1) both;
      }

      h1 {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 36px;
        font-weight: 400;
      }

      .next-button {
        position: relative;
        isolation: isolate;
        display: grid;
        width: min(76vw, 340px);
        aspect-ratio: 1;
        place-items: center;
        overflow: hidden;
        border: 0;
        border-radius: 50%;
        padding: 7px;
        background: linear-gradient(
          125deg,
          #ff4b68,
          #ffae3b,
          #f4ed58,
          #44d99a,
          #49c7fa,
          #9b68ff,
          #ff4b68
        );
        background-size: 300% 300%;
        color: #fff;
        font: inherit;
        cursor: pointer;
        animation: rainbow-flow 5s ease-in-out infinite;
        transition:
          transform 260ms cubic-bezier(0.2, 0.8, 0.2, 1),
          box-shadow 260ms ease;
      }

      .next-button::before {
        position: absolute;
        z-index: -1;
        inset: 7px;
        border-radius: inherit;
        background: #171916;
        content: "";
        transition: inset 260ms ease, background-color 260ms ease;
      }

      .next-button::after {
        position: absolute;
        z-index: 1;
        inset: 0;
        border-radius: inherit;
        background: linear-gradient(
          110deg,
          transparent 36%,
          rgba(255, 255, 255, 0.2) 50%,
          transparent 64%
        );
        content: "";
        transform: translateX(-120%);
      }

      .button-content {
        display: grid;
        justify-items: center;
        gap: 6px;
      }

      .button-label {
        font-size: 36px;
        font-weight: 600;
      }

      .button-arrow {
        font-size: 30px;
        line-height: 1;
        transition: transform 260ms ease;
      }

      .next-button:hover {
        box-shadow:
          0 0 36px rgba(255, 75, 104, 0.2),
          0 0 58px rgba(73, 199, 250, 0.16);
        transform: scale(1.045) rotate(-2deg);
      }

      .next-button:hover::before {
        inset: 4px;
        background: #11140f;
      }

      .next-button:hover::after {
        transition: transform 700ms ease;
        transform: translateX(120%);
      }

      .next-button:hover .button-arrow {
        transform: translateX(7px);
      }

      .next-button:active {
        transform: scale(0.97);
      }

      .next-button:focus-visible {
        outline: 3px solid #fff;
        outline-offset: 7px;
      }

      .player-screen {
        display: grid;
        min-height: 100svh;
        place-items: center;
        background: #050505;
        animation: reveal 550ms ease both;
      }

      video {
        display: block;
        width: 100vw;
        height: 100svh;
        object-fit: contain;
        background: #050505;
      }

      @keyframes rainbow-flow {
        0%,
        100% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
      }

      @keyframes arrive {
        from {
          opacity: 0;
          transform: translateY(18px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes reveal {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="intro" id="intro">
        <h1>А що далі?</h1>
        <button class="next-button" id="next-button" type="button">
          <span class="button-content">
            <span class="button-label">Далі</span>
            <span class="button-arrow" aria-hidden="true">→</span>
          </span>
        </button>
      </section>
      <section class="player-screen" id="player-screen" aria-label="Відео" hidden>
        <video id="video" playsinline controls preload="auto">
          <source src="meme.mp4" type="video/mp4" />
        </video>
      </section>
    </main>
    <script>
      const intro = document.querySelector("#intro");
      const playerScreen = document.querySelector("#player-screen");
      const nextButton = document.querySelector("#next-button");
      const video = document.querySelector("#video");

      nextButton.addEventListener("click", () => {
        intro.hidden = true;
        playerScreen.hidden = false;
        video.muted = false;
        video.volume = 1;
        video.play().catch(() => {
          video.controls = true;
        });
      });
    </script>
  </body>
</html>
